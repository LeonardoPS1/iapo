name: deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: iapo-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-push:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/leonardops1/iapo:latest
            ghcr.io/leonardops1/iapo:sha-${{ github.sha }}

  deploy:
    name: Deploy to VPS (Dokploy)
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 51.222.207.250 >> ~/.ssh/known_hosts 2>/dev/null
      - name: Redeploy iapo on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@51.222.207.250 \
            'sudo git config --global --add safe.directory /etc/dokploy/applications/iapo-iapo-srsxbv/code \
             && sudo git -C /etc/dokploy/applications/iapo-iapo-srsxbv/code pull origin main \
             && cd /etc/dokploy/applications/iapo-iapo-srsxbv/code \
             && sudo docker build -t iapo-iapo-srsxbv:latest . \
             && sudo docker service update --image iapo-iapo-srsxbv:latest --force iapo-iapo-srsxbv'