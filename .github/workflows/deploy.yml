name: deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: iapo-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-push:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/leonardops1/iapo:latest
            ghcr.io/leonardops1/iapo:sha-${{ github.sha }}

  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Trigger Dokploy deploy webhook
        env:
          PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          code=$(curl -s -o /tmp/dok_resp.json -w "%{http_code}" -X POST \
            --max-time 300 \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -H "x-github-delivery: ${{ github.run_id }}" \
            -d "$PAYLOAD" \
            "https://dokploy.aicorebots.com/api/deploy/fK9WZ9rE6pxrhFp-4zJ1Y")
          echo "HTTP $code"
          cat /tmp/dok_resp.json
          echo ""
          if [ "$code" != "200" ]; then exit 1; fi