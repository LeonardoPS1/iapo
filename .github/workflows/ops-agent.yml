name: ops-agent

# Diagnóstico y mantenimiento del agente semanal, directo en el VPS.
#
# Por qué existe: `ops/weekly-ranking/run.sh` se instala en el VPS desde
# `install.sh`, que corre por el workflow `bootstrap-vps-agent`
# (workflow_dispatch). Cuando a un PAT le falta `Actions: write`, un workflow no
# se puede disparar a mano y un push a main queda como el único disparador
# disponible. Por eso el disparador real es el archivo centinela
# `.github/ops-agent.trigger`, que contiene una sola palabra con la acción.
#
# Acciones:
#   diagnose       → corre ops/weekly-ranking/diagnose.sh (timer, logs, toolchain)
#   inventory      → recursos, contenedores y capacidad para un modelo local
#   ollama-audit   → solo lectura: quién consume Ollama y por qué dirección
#   ollama-setup   → verifica capacidad, baja el modelo y apunta IAPO_MODEL a Ollama
#   install-runner → copia run.sh al VPS y lo instala en /usr/local/bin/iapo-ranking-run
#   run            → systemctl start iapo-ranking.service (corrida real, hasta 25 min)
#   all            → install-runner + run + diagnose
#
# Nunca publica secretos: la salida se filtra antes de imprimirse. El repo es
# público, así que el filtrado es obligatorio (mismo criterio que el issue del
# workflow de diagnóstico).

on:
  push:
    branches: [main]
    paths:
      - '.github/ops-agent.trigger'
  workflow_dispatch:
    inputs:
      action:
        description: Acción a correr en el VPS
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - inventory
          - ollama-audit
          - ollama-setup
          - install-runner
          - run
          - all

permissions:
  contents: read

concurrency:
  group: ops-agent
  cancel-in-progress: false

jobs:
  ops:
    name: ops-agent (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolver la acción
        id: action
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
          else
            ACTION="$(tr -d '[:space:]' < .github/ops-agent.trigger)"
          fi
          case "$ACTION" in
            diagnose|inventory|ollama-audit|ollama-setup|install-runner|run|all) ;;
            *) echo "acción inválida: '$ACTION'"; exit 1 ;;
          esac
          echo "value=$ACTION" >> "$GITHUB_OUTPUT"
          echo "acción: $ACTION"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 51.222.207.250 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copiar los scripts al VPS
        run: |
          scp -i ~/.ssh/id_ed25519 \
            ops/weekly-ranking/run.sh \
            ops/weekly-ranking/diagnose.sh \
            ops/weekly-ranking/install.sh \
            ubuntu@51.222.207.250:/tmp/

      - name: Correr la acción en el VPS
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 ubuntu@51.222.207.250 \
            "ACTION='${{ steps.action.outputs.value }}' bash -s" > /tmp/ops.out 2>&1 <<'REMOTE'
          set -uo pipefail
          say() { printf '\n========== %s ==========\n' "$*"; }

          if [ "$ACTION" = "install-runner" ] || [ "$ACTION" = "all" ]; then
            say "install-runner"
            sudo install -m 0755 -o root -g root /tmp/run.sh /usr/local/bin/iapo-ranking-run
            echo "runner instalado; md5=$(md5sum /tmp/run.sh | cut -d' ' -f1)"
          fi

          if [ "$ACTION" = "run" ] || [ "$ACTION" = "all" ]; then
            say "run (systemctl start bloquea hasta que termine, hasta 25 min)"
            sudo systemctl start iapo-ranking.service
            echo "rc del start: $?"
            sudo systemctl show iapo-ranking.service -p ActiveState -p Result -p ExecMainStatus
          fi

          if [ "$ACTION" = "inventory" ] || [ "$ACTION" = "all" ]; then
            say "recursos"
            free -h; echo "vCPU: $(nproc)"; df -h /
            grep -m1 'model name' /proc/cpuinfo || true
            nvidia-smi 2>&1 | sed -n '1,3p' || true

            say "docker"
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}'

            say "ollama"
            # Ojo: filtrar por NOMBRE es una trampa. El contenedor de este compose
            # se llama "postgresollama" y cualquier grep de "ollama" lo matchea:
            # el 2026-10-20 se inspeccionó Postgres creyendo que era Ollama. Se
            # filtra por IMAGEN, y si no hay ninguna, se dice explícitamente.
            OC="$(docker ps --format '{{.Names}}\t{{.Image}}' | awk -F'\t' 'tolower($2) ~ /ollama/ {print $1; exit}')"
            if [ -z "$OC" ]; then
              echo "no hay contenedor con imagen de ollama corriendo"
            else
              echo "contenedor detectado: $OC ($(docker inspect "$OC" --format '{{.Config.Image}}'))"
              docker inspect "$OC" --format 'puertos: {{json .HostConfig.PortBindings}}' 2>&1 || true
              docker inspect "$OC" --format 'compose dir: {{index .Config.Labels "com.docker.compose.project.working_dir"}}' 2>&1 || true
              echo "envs OLLAMA_*:"
              docker inspect "$OC" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>&1 | grep -iE '^OLLAMA' || echo "  (ninguna)"
              echo "ollama list:"
              docker exec "$OC" ollama list 2>&1 || true
              echo "ollama ps:"
              docker exec "$OC" ollama ps 2>&1 || true
            fi
            curl -s -o /dev/null -w '127.0.0.1:11434 => HTTP %{http_code}\n' http://127.0.0.1:11434/api/tags || true
            echo "modelos (host api):"
            curl -s http://127.0.0.1:11434/api/tags 2>&1 | head -c 600; echo
            # .Name, no .Names: docker stats no conoce .Names y la tabla salía vacía.
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' 2>&1 | sed -n '1,15p'

            say "capacidad para un modelo local"
            NEED_MB="${OLLAMA_NEED_MB:-6500}"
            AVAIL_MB="$(awk '/^MemAvailable:/{printf "%d", $2/1024}' /proc/meminfo)"
            DISK_MB="$(df -Pk /var/lib/docker 2>/dev/null | awk 'NR==2{printf "%d", $4/1024}')"
            echo "RAM disponible: ${AVAIL_MB} MB | qwen3:8b necesita ~${NEED_MB} MB (5.2 GB de pesos + KV/overhead)"
            echo "disco libre en /var/lib/docker: ${DISK_MB:-0} MB | necesita ~8000 MB"
            if [ "$AVAIL_MB" -ge "$NEED_MB" ] && [ "${DISK_MB:-0}" -ge 8000 ]; then
              echo "VEREDICTO: entra — ollama-setup puede bajar y correr qwen3:8b"
            else
              echo "VEREDICTO: NO entra — bajar el modelo acá termina en OOM/swap"
            fi
          fi

          # ---------------------------------------------------- ollama-audit
          # Solo lectura. Antes de cerrar el 11434 a internet hay que saber quién
          # le habla y por qué dirección: si un consumidor usa la IP pública o el
          # gateway del host (172.x.0.1) en vez del nombre de servicio del
          # compose, atar el puerto a 127.0.0.1 lo rompe en silencio.
          if [ "$ACTION" = "ollama-audit" ]; then
            say "ollama-audit: contenedor, puertos y redes"
            OC="$(docker ps --format '{{.Names}}\t{{.Image}}' | awk -F'\t' 'tolower($2) ~ /ollama/ {print $1; exit}')"
            if [ -z "$OC" ]; then
              echo "no hay contenedor con imagen de ollama corriendo"
            else
              echo "contenedor: $OC"
              docker inspect "$OC" --format 'puertos: {{json .HostConfig.PortBindings}}' 2>&1 || true
              echo "redes de ollama:"
              docker inspect "$OC" --format '{{range $k, $v := .NetworkSettings.Networks}}  {{$k}} => {{$v.IPAddress}}{{println}}{{end}}' 2>&1 || true
            fi

            say "ollama-audit: envs de los contenedores que nombran ollama/11434"
            for c in $(docker ps --format '{{.Names}}'); do
              docker inspect "$c" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
                | grep -iE 'ollama|11434' | sed "s|^|  $c: |" || true
            done

            say "ollama-audit: compose files y .env de dokploy"
            grep -rniE 'ollama|11434' \
              /etc/dokploy/compose/*/code/docker-compose.y*ml \
              /etc/dokploy/compose/*/code/.env 2>/dev/null | sed -n '1,60p' || true

            say "ollama-audit: workflows de n8n que mencionan ollama/11434"
            docker ps --format '{{.Names}}\t{{.Image}}' | grep -i postgres || true
            # El primer contenedor con imagen postgres puede ser dokploy-postgres
            # (otro stack). Se prefiere el del compose del proyecto aicore.
            PG="$(docker ps --format '{{.Names}}\t{{.Image}}\t{{.Label "com.docker.compose.project"}}' \
              | awk -F'\t' 'tolower($2) ~ /postgres/ && tolower($3) ~ /aicore/ {print $1; exit}')"
            [ -n "$PG" ] || PG="$(docker ps --format '{{.Names}}\t{{.Image}}' | awk -F'\t' 'tolower($2) ~ /postgres/ {print $1; exit}')"
            echo "postgres elegido: ${PG:-(ninguno)}"
            if [ -n "$PG" ]; then
              PSQL="$PG"
              echo "--- listar bases (probando -U postgres y -U n8n) ---"
              DBS="$(docker exec "$PSQL" psql -U postgres -Atc \
                "SELECT datname FROM pg_database WHERE datname NOT IN ('template0','template1')" 2>&1 | tr '\n' ' ')"
              case "$DBS" in
                *FATAL*|*denied*|*error*|"") DBS="$(docker exec "$PSQL" sh -c \
                  "psql -U \"\${POSTGRES_USER:-postgres}\" -Atc \"SELECT datname FROM pg_database WHERE datname NOT IN ('template0','template1')\"" 2>&1 | tr '\n' ' ')" ;;
              esac
              echo "bases: $DBS"
              for db in $DBS; do
                WF="$(docker exec "$PSQL" psql -U postgres -d "$db" -Atc \
                  "SELECT name FROM workflow_entity WHERE nodes::text ILIKE '%ollama%' OR nodes::text ILIKE '%11434%'" 2>&1)"
                case "$WF" in
                  *relation*|*FATAL*|"") continue ;;
                esac
                echo "  [$db] workflows: $(echo "$WF" | tr '\n' ';')"
              done
              N8NDB="$(echo "$DBS" | tr ' ' '\n' | grep -x n8n | head -1)"
              echo "--- modelos referenciados en $N8NDB ---"
              if [ -n "$N8NDB" ]; then
                docker exec "$PSQL" psql -U postgres -d "$N8NDB" -Atc \
                  "SELECT nodes::text FROM workflow_entity" 2>&1 \
                  | grep -oiE 'https?://[^"\\ ]*11434[^"\\ ]*|"(gemma3|llama3\.2|qwen3|mistral)[^"]*"' \
                  | sort | uniq -c | sort -rn | sed -n '1,15p' | sed 's/^/  /' || true
              fi
            fi

            say "ollama-audit: bloque ollama + init-ollama del compose"
            COMPOSE="/etc/dokploy/compose/aicore-n8nrunnerpostgresollama-a715gi/code/docker-compose.yml"
            awk '/^  ollama:/,/^  [a-z-]+:$/' "$COMPOSE" 2>/dev/null | head -40 || true
            echo "--- init-ollama ---"
            awk '/^  init-ollama:/,0' "$COMPOSE" 2>/dev/null | sed -n '1,18p' || true

            say "ollama-audit: que hace el dashboard con OLLAMA_MODEL"
            DASH=/etc/dokploy/applications/app-hack-back-end-sensor-jd2eu3/code
            if [ -d "$DASH" ]; then
              grep -rn --include=*.ts --include=*.tsx --include=*.js -E 'OLLAMA_MODEL|OLLAMA_BASE_URL' "$DASH/src" 2>/dev/null | sed -n '1,10p' || true
              echo "--- prompt / llamada al modelo (contexto) ---"
              F="$(grep -rln --include=*.ts -E 'OLLAMA_MODEL|OLLAMA_BASE_URL' "$DASH/src" 2>/dev/null | head -1)"
              if [ -n "$F" ]; then
                echo "archivo: $F"
                grep -n -B4 -A12 -E 'OLLAMA_MODEL|chat/completions|generate' "$F" 2>/dev/null | sed -n '1,45p' || true
              fi
            else
              echo "no existe $DASH"
            fi

            say "ollama-audit: clientes que aparecen en el log de ollama"
            if [ -n "$OC" ]; then
              docker logs "$OC" --tail 1000 2>&1 \
                | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | sort | uniq -c | sort -rn | sed -n '1,12p' || true
            fi

            say "ollama-audit: firewall del host"
            sudo ufw status verbose 2>&1 | sed -n '1,12p' || true
            sudo iptables -S DOCKER-USER 2>&1 | sed -n '1,10p' || true
          fi

          # ---------------------------------------------------- ollama-close
          # Cierra el 11434 a internet sin romper a nadie. Docker publica
          # puertos saltandose ufw, por eso el servicio estaba abierto con ufw
          # en "deny (incoming)". Se atan DOS binds explicitos:
          #   127.0.0.1  -> opencode (el agente semanal) corre en el host
          #   172.18.0.1 -> el dashboard (swarm) usa http://172.18.0.1:11434
          # La IP publica se queda sin listener: deja de ser alcanzable.
          if [ "$ACTION" = "ollama-close" ]; then
            say "ollama-close"
            COMPOSE="/etc/dokploy/compose/aicore-n8nrunnerpostgresollama-a715gi/code/docker-compose.yml"
            if [ ! -f "$COMPOSE" ]; then
              echo "ABORTADO: no existe $COMPOSE"
              exit 5
            fi
            cp -a "$COMPOSE" "$COMPOSE.bak-$(date +%Y%m%dT%H%M%S)"
            echo "backup: $(ls -1t "$COMPOSE".bak-* | head -1)"

            if grep -q '127.0.0.1:11434' "$COMPOSE"; then
              echo "el mapeo ya estaba atado a loopback; no se toca"
            else
              awk '
                $0 ~ /^[[:space:]]*-[[:space:]]*"?11434:11434"?[[:space:]]*$/ {
                  print "      - \"127.0.0.1:11434:11434\""
                  print "      - \"172.18.0.1:11434:11434\""
                  next
                }
                { print }
              ' "$COMPOSE" > /tmp/compose.new || exit 6
              if ! grep -q '172.18.0.1:11434' /tmp/compose.new; then
                echo "ABORTADO: no se encontro la linea '- 11434:11434' en el compose"
                exit 6
              fi
              cp /tmp/compose.new "$COMPOSE"
              echo "mapeo reemplazado por 127.0.0.1 y 172.18.0.1"
            fi

            if grep -q 'OLLAMA_CONTEXT_LENGTH' "$COMPOSE"; then
              echo "OLLAMA_CONTEXT_LENGTH ya estaba; no se toca"
            else
              awk '
                /^  ollama:[[:space:]]*$/ { inside=1 }
                inside && !done && /^    image:[[:space:]]*ollama\/ollama/ {
                  print
                  print "    environment:"
                  print "      - OLLAMA_CONTEXT_LENGTH=16384"
                  print "      - OLLAMA_KEEP_ALIVE=10m"
                  done=1
                  next
                }
                { print }
              ' "$COMPOSE" > /tmp/compose.new || exit 7
              cp /tmp/compose.new "$COMPOSE"
              echo "agregado OLLAMA_CONTEXT_LENGTH=16384 (el default de 4096 no alcanza para el agente)"
            fi

            # init-ollama vuelve a bajar los modelos en cada deploy del stack:
            # si sigue pidiendo llama3.2, el modelo borrado reaparece solo.
            if grep -q 'ollama pull llama3.2' "$COMPOSE"; then
              sed -i 's|ollama pull llama3.2:latest; ||; s|sleep 3; ollama pull gemma3:latest|sleep 3; ollama pull gemma3:latest|' "$COMPOSE"
              echo "init-ollama ya no baja llama3.2"
            fi

            echo "--- diff contra el backup ---"
            diff -u "$(ls -1t "$COMPOSE".bak-* | head -1)" "$COMPOSE" | sed -n '1,40p' || true

            say "ollama-close: recreando solo el servicio ollama"
            ( cd "$(dirname "$COMPOSE")" && docker compose up -d ollama ) 2>&1 | tail -n 8
            sleep 6

            OC="$(docker ps --format '{{.Names}}\t{{.Image}}' | awk -F'\t' 'tolower($2) ~ /ollama/ {print $1; exit}')"
            echo "bindings: $(docker inspect "$OC" --format '{{json .HostConfig.PortBindings}}' 2>&1)"
            for u in http://127.0.0.1:11434/api/tags http://172.18.0.1:11434/api/tags; do
              curl -s -o /dev/null -w "$u => HTTP %{http_code}\n" --max-time 6 "$u" || true
            done
            echo "desde la IP publica (tiene que fallar):"
            curl -s -o /dev/null -w "51.222.207.250:11434 => HTTP %{http_code}\n" --max-time 6 \
              http://51.222.207.250:11434/api/tags || echo "  conexion rechazada — correcto"
          fi

          # ---------------------------------------------------- ollama-setup
          # Deja el agente semanal corriendo contra Ollama local en vez de un
          # modelo pago. La verificación de capacidad va PRIMERO y aborta sin
          # bajar nada: un modelo de 5.2 GB en una VPS con 2.6 GB disponibles no
          # "anda lento", se come el swap y arrastra a los otros contenedores.
          OLLAMA_RC=0
          if [ "$ACTION" = "ollama-setup" ]; then
            say "ollama-setup"
            OC="$(docker ps --format '{{.Names}}\t{{.Image}}' | awk -F'\t' 'tolower($2) ~ /ollama/ {print $1; exit}')"
            NEED_MB="${OLLAMA_NEED_MB:-6500}"
            AVAIL_MB="$(awk '/^MemAvailable:/{printf "%d", $2/1024}' /proc/meminfo)"
            DISK_MB="$(df -Pk /var/lib/docker 2>/dev/null | awk 'NR==2{printf "%d", $4/1024}')"
            echo "contenedor: ${OC:-(ninguno)}"
            echo "RAM disponible: ${AVAIL_MB} MB (necesario ~${NEED_MB}); disco libre: ${DISK_MB:-0} MB (necesario ~8000)"

            if [ -z "$OC" ]; then
              echo "ABORTADO: no hay contenedor de ollama corriendo"
              OLLAMA_RC=4
            elif [ "$AVAIL_MB" -lt "$NEED_MB" ] || [ "${DISK_MB:-0}" -lt 8000 ]; then
              echo "ABORTADO: esta VPS no tiene capacidad para qwen3:8b — no se bajó nada"
              OLLAMA_RC=3
            else
              echo "bajando qwen3:8b (varios minutos)…"
              if docker exec "$OC" ollama pull qwen3:8b; then
                docker exec "$OC" ollama list
                echo "apuntando IAPO_MODEL a ollama/qwen3:8b"
                sudo sed -i -E 's|^IAPO_MODEL=.*|IAPO_MODEL=ollama/qwen3:8b|' /etc/iapo-agent/secrets.env
                grep '^IAPO_MODEL=' /etc/iapo-agent/secrets.env || echo "  (no se pudo leer IAPO_MODEL)"
                echo "smoke: opencode run --model ollama/qwen3:8b como iapoagent (cwd = repo)"
                # sudo -u y no runuser: el usuario de servicio tiene shell nologin.
                # El cd al repo es obligatorio: opencode corre con el proyecto como
                # cwd (agente weekly-ranking + permisos) y sincroniza el clon.
                sudo -u iapoagent bash -c 'cd /opt/iapo-agent/repo || exit 1
                  export PATH="$HOME/.opencode/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
                  git fetch --prune origin main >/dev/null 2>&1 && git reset --hard origin/main >/dev/null 2>&1
                  timeout 300 opencode run --model ollama/qwen3:8b "Responde exactamente: ok"' 2>&1 | tail -n 20
                SMOKE_RC=${PIPESTATUS[0]}
                echo "rc del smoke: $SMOKE_RC"
                if [ "$SMOKE_RC" -eq 0 ]; then
                  # Solo se borra DESPUES de que el modelo nuevo respondio: si el
                  # smoke falla se conserva todo para poder diagnosticar.
                  say "limpieza: un modelo por consumidor"
                  # gemma3:latest NO se borra. El dashboard (consultorio-medico)
                  # lo usa para vision/OCR (lib/vision-ocr.ts), IA clinica,
                  # encuestas y transcripcion; qwen3:8b es solo texto.
                  KEEP="gemma3:latest qwen3:8b"
                  docker exec "$OC" sh -c 'ollama list | awk "NR>1 {print \$1}"' | while read -r M; do
                    [ -n "$M" ] || continue
                    case " $KEEP " in
                      *" $M "*) echo "  se queda: $M" ;;
                      *) echo "  borrando: $M"; docker exec "$OC" ollama rm "$M" >/dev/null 2>&1 || echo "    no se pudo borrar" ;;
                    esac
                  done
                  echo "--- modelos finales ---"
                  docker exec "$OC" ollama list
                  echo "--- disco del volumen ---"
                  du -sh /var/lib/docker/volumes/aicore-n8nrunnerpostgresollama-a715gi_ollama_storage 2>/dev/null || true
                else
                  OLLAMA_RC=6
                fi
              else
                echo "falló el pull de qwen3:8b"
                OLLAMA_RC=5
              fi
            fi
          fi

          say "agent-status.json publicado"
          sudo cat /opt/iapo-agent/repo/src/data/agent-status.json
          echo

          if [ "$ACTION" = "diagnose" ] || [ "$ACTION" = "all" ]; then
            say "diagnose"
            sudo bash /tmp/diagnose.sh
          fi

          if [ "${OLLAMA_RC:-0}" -ne 0 ]; then
            echo "ollama-setup NO completó (rc=$OLLAMA_RC)"
            exit "$OLLAMA_RC"
          fi
          REMOTE
          RC=$?
          echo "ssh rc=$RC" >> /tmp/ops.out
          echo
          echo "========== salida filtrada =========="
          sed -E \
            -e 's/(MODEL_API_KEY[=:][[:space:]]*).*/\1REDACTED/' \
            -e 's/(VPS_SSH_KEY[=:][[:space:]]*).*/\1REDACTED/' \
            -e 's/(sk-)[A-Za-z0-9_-]{8,}/\1REDACTED/g' \
            -e 's/(eyJ)[A-Za-z0-9_.-]{20,}/\1REDACTED/g' \
            /tmp/ops.out
          exit "$RC"
