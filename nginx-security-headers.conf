# Headers de seguridad para iapo.cl.
#
# Este archivo se copia a /etc/nginx/snippets/security-headers.conf y se incluye
# con `include` en el bloque `server` y en cada `location` que tenga su propio
# `add_header` (nginx NO hereda los headers del server si el location declara uno).
#
# Origenes externos que el sitio realmente usa:
#   - fonts.googleapis.com / fonts.gstatic.com .... tipografias
#   - giscus.app ................................. client.js + iframe + api de comentarios (/extra/<slug>)
#   - db52c710.sibforms.com ...................... iframe del boletin (Brevo)
#   - static.cloudflareinsights.com / cloudflareinsights.com ... beacon de analitica
#     que Cloudflare inyecta en el borde (no esta en el repo)
#
# Nota: 'unsafe-inline' en script-src es necesario porque Astro emite scripts y
# JSON-LD inline en el HTML.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://giscus.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cloudflareinsights.com https://giscus.app; frame-src https://giscus.app https://db52c710.sibforms.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
