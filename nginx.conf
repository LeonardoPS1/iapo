server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad (ver nginx-security-headers.conf).
    # Se incluyen tambien dentro de cada location que declare su propio add_header,
    # porque nginx no hereda los add_header del server en ese caso.
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|png|jpe?g|webp|avif|svg|ico|woff2?|ttf)$ {
        # Cache larga: los assets de Astro llevan hash en el nombre.
        # (Un solo header Cache-Control: `expires` + `add_header` emitirian dos.)
        add_header Cache-Control "public, max-age=604800, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:xml|txt)$ {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
